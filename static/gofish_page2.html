<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GO FISH GAME</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <div class="top">
        <!-- Logo in the middle of the page -->
        <div class="logo">
          <img src="visuals/gofish_logo.png" alt="My Logo" width="25%" />
        </div>
        <!-- Navigation Bar with functions -->
        <nav>
          <a id="start">Start</a>
          <a href="gofish_page3.html">Tools</a>
          <a href="gofish_page4.html">Fish</a>
          <a href="gofish_page5.html">About</a>
        </nav>
      </div>
    </header>

    <section>
      <!--points,level & timer -->
      <div class="middle">
        <div class="midbox">
          <button type="button" id="pause_button">PAUSE</button>
          <p>TargetPoints: <strong id="target">0</strong></p>
          <p>Points: <strong id="score">0</strong></p>
        </div>
        <div id="hook" class="triangle-down"></div>
        <div class="midbox">
          <p>Level: <strong id="level">0</strong></p>
          <button id="start">Start rotation</button>
          <p>Timer: <strong id="timer">00:00</strong></p>
        </div>
      </div>
    </section>

    <section>
      <!-- gamescreen with fish -->
      <div class="gamescreen">
        <img src="visuals/smallfish1.png" class="small-fish" alt="Small fish" width="13%" height="13%"/>
        <img src="visuals/mediumfish1.png" class="medium-fish" alt="Medium fish" width="17%" height="17%"/>
        <img src="visuals/bigfish1.png" class="big-fish" alt="Big fish" width="40%" height="40%"/>
      </div>
    </section>
  </body>
</html>
