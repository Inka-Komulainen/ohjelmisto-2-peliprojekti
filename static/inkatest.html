<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>inka test</title>
        <script src="inka-test.js" defer></script>
        <style>
        .triangle-down {
	        width: 0;
	        height: 0;
	        border-left: 25px solid transparent;
	        border-right: 25px solid transparent;
	        border-top: 50px solid #555;
            transform: rotate(0deg);
        }
        .test {
            margin: 30px;
            bottom: 50%;
            left: calc(50% - 2px);
            width: 4px;
            height: 200px;
            transform-origin: bottom center;
            border-radius: 4px;
            transform: rotate(0deg); 
            background-color: #555;
        }
        </style>
    </head>
    <body id="game">
        <div class="test"></div>
        <div id="hook" class="triangle-down"></div>
        <button id="start">Start rotation</button>
    </body>
</html>
