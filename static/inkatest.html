<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>inka test</title>
        <script src="inka-test.js" defer></script>
        <style>
        .triangle-down {
            position:absolute; 
            top:30px; 
            left: 50%;
	        width: 0;
	        height: 0;
	        border-left: 25px solid transparent;
	        border-right: 25px solid transparent;
	        border-top: 50px solid #555;
            transform: rotate(0deg);
        }
        .test {
            position:absolute; 
            top: 30px;
            margin: 30px;
            bottom: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            transform-origin: top center;
            border-radius: 4px;
            transform: rotate(0deg); 
            background-color: #555;
        }
            .test-fish {
            position:absolute; 
            top: 100px;
            left:550px;
	        width: 0;
	        height: 0;
	        border-left: 25px solid transparent;
	        border-right: 25px solid transparent;
	        border-top: 50px solid #20b560;
        }
        </style>
    </head>
    <body id="game">
        <div id="hook" class="triangle-down"></div>
        <div id="fish" class="test-fish"></div>
        <button id="start">Start rotation</button>
    </body>
</html>
